<div id="showHealthPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-title="Show Health"
     data-controller="__plugin/showhealthjs">
    <div data-role="content">
        <div class="content-primary" style="max-width:none;">

            <!-- Header -->
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1em;">
                <h1>Show Health</h1>
                <span id="showHealthSummary" style="color:#888;font-size:0.9em;"></span>
            </div>

            <!-- Sort bar -->
            <div id="showHealthSortBar" style="display:flex;gap:8px;margin-bottom:1em;align-items:center;flex-wrap:wrap;">
                <button is="emby-button" class="raised" data-sort="status" style="font-size:0.85em;">By Status</button>
                <button is="emby-button" class="raised" data-sort="missing" style="font-size:0.85em;">By Missing</button>
                <button is="emby-button" class="raised" data-sort="release" style="font-size:0.85em;">By Release</button>
                <button is="emby-button" class="raised" data-sort="name" style="font-size:0.85em;">A-Z</button>
                <span style="flex:1;"></span>
                <label style="display:flex;align-items:center;gap:6px;font-size:0.85em;cursor:pointer;">
                    <input type="checkbox" id="showHealthHideComplete" is="emby-checkbox" />
                    <span>Hide Complete</span>
                </label>
                <button is="emby-button" id="showHealthClearCache" class="raised" style="font-size:0.85em;background:#3a1a1a;color:#e5383b;">Clear Cache</button>
            </div>

            <!-- Error message -->
            <div id="showHealthError" style="display:none;padding:1em;background:#3a1a1a;border-radius:4px;margin-bottom:1em;color:#e5383b;"></div>

            <!-- Table -->
            <div id="showHealthTableContainer"></div>

        </div>
    </div>
</div>
