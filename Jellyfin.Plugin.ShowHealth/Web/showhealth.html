<div id="showHealthPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-title="Show Health"
     data-controller="__plugin/showhealthjs">
    <div data-role="content">
        <div class="content-primary" style="max-width:none;">

            <!-- Header -->
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1em;">
                <h1>Show Health</h1>
                <span id="showHealthSummary" style="color:#888;font-size:0.9em;"></span>
            </div>

            <!-- Toolbar: Sort buttons + Settings -->
            <div id="showHealthSortBar" style="display:flex;gap:8px;margin-bottom:1em;align-items:center;">
                <button is="emby-button" class="raised" data-sort="status" style="font-size:0.85em;">Status</button>
                <button is="emby-button" class="raised" data-sort="gaps" style="font-size:0.85em;">Gaps</button>
                <button is="emby-button" class="raised" data-sort="trailing" style="font-size:0.85em;">Trailing</button>
                <button is="emby-button" class="raised" data-sort="release" style="font-size:0.85em;">Release</button>
                <button is="emby-button" class="raised" data-sort="name" style="font-size:0.85em;">A-Z</button>
                <span style="flex:1;"></span>
                <button is="emby-button" id="showHealthSettings" class="raised" style="font-size:0.85em;">Settings</button>
            </div>

            <!-- First-run / no snapshot message -->
            <div id="showHealthFirstRun" style="display:none;padding:2em;text-align:center;">
                <p style="color:#aaa;font-size:1.1em;margin-bottom:1em;">No analysis available yet.</p>
                <p style="color:#666;font-size:0.9em;margin-bottom:1.5em;">The task runs automatically every 24h, or start it manually now.</p>
                <button is="emby-button" id="showHealthRunScan" class="raised" style="font-size:1em;padding:10px 24px;">Analyze now</button>
            </div>

            <!-- Error message -->
            <div id="showHealthError" style="display:none;padding:1em;background:#3a1a1a;border-radius:4px;margin-bottom:1em;color:#e5383b;"></div>

            <!-- Table -->
            <div id="showHealthTableContainer"></div>

        </div>
    </div>
</div>
