framework: "net9.0"
overview: "TV series completeness checker — find missing episodes and seasons"
description: >
  Jellyfin plugin that checks your TV series library for completeness.
  Compares local episodes and seasons against TVmaze data and reports what is missing.
category: "General"
owner: "IsntFunny"
artifacts:
- "Jellyfin.Plugin.ShowHealth.dll"
changelog: >
  The IMDb API this plugin relied on (api.imdbapi.dev) has shut down. Series
  and episode data now comes from TVmaze — free, no API key, and matched via
  the IMDb IDs your library already has. Scans are also faster: one request
  per series instead of one per season. Episodes without a known air date are
  no longer reported as missing, and announced seasons with nothing aired yet
  are ignored. The cached IMDb data is discarded automatically on first start.
