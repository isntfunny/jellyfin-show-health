overview: "TV series completeness checker — find missing episodes and seasons"
description: >
  Jellyfin plugin that checks your TV series library for completeness.
  Compares local episodes and seasons against IMDb data and reports what is missing.
category: "General"
owner: "IsntFunny"
artifacts:
- "Jellyfin.Plugin.ShowHealth.dll"
changelog: >
  Gap vs trailing classification — missing episodes and seasons are now classified
  as gaps (between existing content) or trailing (at the end). Dashboard shows
  separate Gaps and Trailing columns with red/orange color coding. Snapshot-based
  dashboard loading — analysis runs as a scheduled task (daily at 3:00 AM) and
  after every library scan (ILibraryPostScanTask), dashboard loads instantly from
  cached snapshot. CSV export with three modes (all episodes, only gaps, by show).
  Ignore list — hide shows from dashboard and suppress notifications, with management
  dialog to restore. Settings dialog consolidates filters, export, ignored shows,
  and cache reset. Sort by gaps or trailing count. User preferences persisted in
  localStorage. All UI strings in English. Skip unnumbered IMDb episodes (specials
  with episodeNumber=null). Populate episode details for missing seasons in export.
